theme = "onedark"

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[keys.normal.q]
m = "replay_macro"
q = ":quit"
w = ":write-quit"

[keys.normal]
D = ["select_mode", "goto_line_end", "delete_selection"]
K = ["move_line_up", "join_selections"]

# following mappings are shared by all modes
"Cmd-r" = [":config-reload", ":reload"]
"Cmd-s" = ":write!"
"Cmd-[" = "unindent"
"Cmd-]" = "indent"
"Cmd-/" = "toggle_comments"

[keys.insert]
"Cmd-r" = [":config-reload", ":reload"]
"Cmd-s" = ":write!"
"Cmd-[" = "unindent"
"Cmd-]" = "indent"
"Cmd-/" = "toggle_comments"

[keys.select]
"Cmd-r" = [":config-reload", ":reload"]
"Cmd-s" = ":write!"
"Cmd-[" = "unindent"
"Cmd-]" = "indent"
"Cmd-/" = "toggle_comments"
